[project]
name = "pyspark-dq-recon-framework"
version = "0.1.0"
description = "Contract-driven PySpark ingestion: data quality, quarantine, SCD2 and source-to-target reconciliation (local, EMR, Glue)"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5.2,<3.6", "pyyaml>=6.0", "setuptools>=68"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["dqframe*"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["airflow"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
